<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Sidebar -->

<div class="sidebar" id="sidebar">

<div class="close-btn" onclick="closeMenu()">
✕
</div>

<ul>

<li onclick="showAll()">🏠 Home</li>

<li onclick="filterType('Movie')">
🎬 Movies
</li>

<li onclick="filterType('Series')">
📺 Series
</li>

<li onclick="showWatching()">
👀 Watching
</li>

<li onclick="showWatched()">
✅ Watched
</li>

<li onclick="showFavorites()">
❤️ Favorites
</li>

</ul>

</div>

<!-- Header -->

<header>

<div class="menu" onclick="openMenu()">
☰
</div>

<div class="search-box">

<input
type="text"
placeholder="Search Drama...">

<span>🔍</span>

</div>

</header>

<!-- Hero Banner -->

<section class="hero">

<img
src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200">

<div class="overlay">

<h1>Gen Z Hub</h1>

<p>
Track all your favorite dramas
</p>

<div class="hero-btns">

<button class="watch">
▶ Watch
</button>

<button class="rating">
⭐ 8.5
</button>

</div>

</div>

</section>

<!-- Stats -->

<section class="stats">

<div class="stat">
<h3 id="totalDramas">0</h3>
<p>Total</p>
</div>

<div class="stat">
<h3 id="watchingCount">0</h3>
<p>Watching</p>
</div>

<div class="stat">
<h3 id="watchedCount">0</h3>
<p>Watched</p>
</div>

</section>

<!-- Latest -->

<div class="section-title">

<span></span>

<h2>
LATEST DRAMAS
</h2>

</div>

<!-- Drama Grid -->

<section class="grid">

</section>

<!-- Floating Button -->

<button
class="fab"
onclick="openModal()">

+

</button>

<!-- Add Drama Modal -->

<div class="modal" id="addModal">

<div class="modal-box">

<h2>Add Drama</h2>

<input id="title" placeholder="Title">

<input id="poster" placeholder="Poster URL">

<input id="genre" placeholder="Genre">

<input id="rating" placeholder="Rating">

<input id="year" placeholder="Year">

<input id="language" placeholder="Language">

<input id="quality" placeholder="Quality">

<input id="watch" placeholder="Watch Link">

<input id="trailer" placeholder="Trailer Link">

<select id="type">

<option>Movie</option>

<option>Series</option>

</select>

<button onclick="saveDrama()">
Save Drama
</button>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
