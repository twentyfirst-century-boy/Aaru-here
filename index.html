<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Z Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<div class="menu">☰</div>

<div class="search-box">
<input type="text" placeholder="Search ...">
<span>🔍</span>
</div>

</header>

<section class="hero">

<img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1200">

<div class="overlay">
<h1>Gen Z Hub</h1>
<p>Track all your dramas and series</p>

<div class="hero-btns">
<button class="watch">▶ Watch</button>
<button class="rating">⭐ 8.5</button>
</div>
</div>

</section>

<div class="section-title">
<span></span>
<h2>LATEST DRAMAS</h2>
</div>

<section class="grid">

<div class="card">
<div class="poster">

<img src="https://picsum.photos/300/450?1">

<div class="badge rating-badge">⭐ 8.5</div>

<div class="badge quality">WEB-DL</div>

<div class="badge lang">Hi-En</div>

</div>

<h3>My Dearest Assassin</h3>

<div class="meta">
<span>2025</span>
<span class="pill">TV</span>
</div>

</div>

<div class="card">
<div class="poster">

<img src="https://picsum.photos/300/450?2">

<div class="badge rating-badge">⭐ 9.0</div>

<div class="badge quality">WEB-DL</div>

<div class="badge lang">Hi-Ko</div>

</div>

<h3>Office Romance</h3>

<div class="meta">
<span>2024</span>
<span class="pill">TV</span>
</div>

</div>

</section>

<button class="fab">+</button>

</body>
</html>
