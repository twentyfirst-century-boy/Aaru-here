<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen Z Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🎬 Gen Z Hub</h1>

<div class="top-bar">

<input type="text" id="searchInput" placeholder="Search drama...">

<button onclick="openAddModal()">
+ Add Drama
</button>

</div>

</header>

<section class="hero">
<h2>Your Drama Collection</h2>
<p>Track watched & watching dramas.</p>
</section>

<div id="dramaContainer" class="drama-grid"></div>

<div id="addModal" class="modal">

<div class="modal-content">

<h2>Add Drama</h2>

<input id="title" placeholder="Title">
<input id="poster" placeholder="Poster Image URL">
<input id="genre" placeholder="Genre">
<input id="rating" placeholder="Rating">
<input id="year" placeholder="Year">
<input id="language" placeholder="Language">
<input id="quality" placeholder="Quality">
<input id="watchLink" placeholder="Watch Link">
<input id="trailer" placeholder="YouTube Trailer Link">

<button onclick="addDrama()">Save</button>

</div>
</div>

<script src="app.js"></script>

</body>
</html>
